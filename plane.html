<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;touch-action:none;font-family:monospace}
canvas{display:block;background:#0a0a2a}
#hud{position:fixed;top:10px;left:15px;color:#fff;font:bold 14px/1.8 monospace;z-index:10;text-shadow:1px 1px 2px #000}
#hud .score{color:#ff0} #hud .lives{color:#0f0} #hud .power{color:#0ff}
/* 红色长条血条 */
#lifeBarWrap{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
#lifeBar{display:inline-block;width:110px;height:14px;background:rgba(0,0,0,.6);border:1px solid #f00;border-radius:7px;overflow:hidden;vertical-align:middle}
#lifeBarFill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f00,#f66);transition:width .2s}
#livesVal{color:#ff5252}
#bossBar{position:fixed;top:50px;left:50%;transform:translateX(-50%);width:300px;height:16px;background:rgba(0,0,0,.7);border:1px solid #f00;border-radius:8px;display:none;z-index:10}
#bossBarFill{height:100%;background:linear-gradient(90deg,#f00,#ff0);border-radius:8px;width:100%}
#bossBarText{position:absolute;top:-18px;left:0;color:#f00;font:bold 13px monospace;text-shadow:0 0 4px #f00}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:30}
#startScreen{background:rgba(0,0,0,.85);color:#fff}
#gameOver,#victory{background:rgba(0,0,0,.8);color:#fff;display:none}
.btn{position:relative;z-index:31;margin-top:20px;padding:12px 32px;font:bold 18px monospace;background:#ff0;color:#000;border:none;border-radius:8px;cursor:pointer}
.btn:active{background:#cc0}
#leaderboard{margin-top:15px;font:14px monospace;color:#aaa;text-align:center}
#tip{position:fixed;bottom:10px;color:rgba(255,255,255,.4);font:12px monospace;text-align:center;width:100%;z-index:10}
/* 💣 手机炸弹按钮 */
.bomb-btn{position:fixed;right:16px;bottom:54px;z-index:32;width:60px;height:60px;border-radius:50%;border:2px solid #f33;background:rgba(90,0,0,.75);color:#fff;font:bold 11px monospace;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 0 14px rgba(255,40,40,.55);user-select:none;-webkit-tap-highlight-color:transparent}
.bomb-btn:active{background:rgba(160,0,0,.95);transform:scale(.92)}
.bomb-btn.disabled{opacity:.45;filter:grayscale(.8);cursor:not-allowed;box-shadow:none}
.bomb-btn.disabled:active{background:rgba(90,0,0,.75);transform:none}
.bomb-btn span{font-size:18px;color:#ff5252}
#bombIcon{font-size:20px}
/* 🌀🔴 主动技能按钮（手机） */
.skill-btn{position:fixed;z-index:32;width:60px;height:60px;border-radius:50%;border:2px solid;color:#fff;font:bold 11px monospace;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;user-select:none;-webkit-tap-highlight-color:transparent}
.skill-btn:active{transform:scale(.92)}
.skill-btn.disabled{opacity:.4;filter:grayscale(.85);cursor:not-allowed}
.skill-btn.disabled:active{transform:none}
.skill-btn .ic{font-size:22px;line-height:1}
.skill-btn .cd{font-size:10px;margin-top:1px}
#spinBtn{left:16px;bottom:54px;border-color:#0cf;background:rgba(0,40,70,.75);box-shadow:0 0 14px rgba(0,180,255,.5)}
#spinBtn:active{background:rgba(0,120,200,.95)}
#laserBtn{right:16px;bottom:124px;border-color:#f33;background:rgba(70,0,0,.75);box-shadow:0 0 14px rgba(255,60,60,.5)}
#laserBtn:active{background:rgba(160,0,0,.95)}
/* 🔓 火力 Lv30「突破技」按钮：直接开大 10 秒 + 移速×2 + 回 3 血 */
#breakBtn{left:50%;transform:translateX(-50%);bottom:16px;border-color:#fd4;background:rgba(80,60,0,.85);box-shadow:0 0 18px rgba(255,210,60,.65)}
#breakBtn:active{background:rgba(150,110,0,.95)}
#breakBtn .ic{font-size:20px}
#breakBtn .cd{font-size:9px;line-height:1.1}
/* 🔓 突破技激活期间的机身辉光（移速×2 的视觉反馈） */
.break-aura{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,220,80,.7);box-shadow:0 0 40px 12px rgba(255,200,40,.45);opacity:0;transition:opacity .2s}
.break-aura.on{opacity:1}
/* 💬 提示气泡 */
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:45;color:#ff0;font:bold 15px monospace;text-shadow:0 0 6px #f90;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* 🔓 火力突破上限（Lv30）标识 */
#powerWrap.breakthrough{color:#ff0;text-shadow:0 0 6px #f90}
#powerWrap.breakthrough #powerVal{color:#fff}
#powerWrap.breakthrough::after{content:'（突破上限）';color:#f90;font-size:11px;margin-left:4px;text-shadow:0 0 5px #f90}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="score">分数: <span id="scoreVal">0</span></div>
<div class="lives">生命:
  <span id="lifeBarWrap">
    <span id="lifeBar"><span id="lifeBarFill"></span></span>
    <span id="livesVal">x5</span>
  </span>
</div>
<div class="power">火力: <span id="powerWrap">Lv.<span id="powerVal">1</span></span> | 💣<span id="bombVal">0</span></div>
</div>
<button id="bombBtn" class="bomb-btn"><span id="bombIcon">💣</span><span id="bombCount">0</span></button>
<button id="spinBtn" class="skill-btn"><span class="ic">🌀</span><span class="cd">Lv5</span></button>
<button id="laserBtn" class="skill-btn"><span class="ic">🔴</span><span class="cd">Lv10</span></button>
<button id="breakBtn" class="skill-btn"><span class="ic">⚡</span><span class="cd">Lv30</span></button>
<div id="breakAura" class="break-aura"></div>
<div id="bossBar"><div id="bossBarText">👹 BOSS 1/3</div><div id="bossBarFill"></div></div>
<div id="toast"></div>
<div id="tip">电脑: WASD/方向键移动 · 空格炸弹 · Q旋转 · E激光 · R突破技 | 手机: 拖动移动 · 💣炸弹 · 🌀/🔴/⚡点按</div>

<div id="startScreen" class="overlay">
<div style="font-size:32px;color:#ff0">✈️ 飞机大战</div>
<div style="margin-top:10px;font-size:14px;color:#aaa">击毁敌机攒分，3000分挑战BOSS！通关3个BOSS获胜！</div>
<button class="btn" id="startBtn">开始游戏</button>
<div id="leaderboard"></div>
</div>
<div id="gameOver" class="overlay">
<div style="font-size:28px">💥 游戏结束</div>
<div style="font-size:18px;margin-top:10px">得分: <span id="finalScore">0</span></div>
<div id="newRecord" style="color:#ff0;display:none;margin-top:5px">🏆 新纪录！</div>
<button class="btn" id="restartBtn">再来一局</button>
</div>
<div id="victory" class="overlay">
<div style="font-size:28px;color:#ff0">🎉 通关胜利！</div>
<div style="font-size:18px;margin-top:10px">最终得分: <span id="vicScore">0</span></div>
<button class="btn" id="victoryBtn">再来一局</button>
</div>

<script>
"use strict";
// ===== 所有函数和变量都在全局作用域（严格模式仍会挂载到 window） =====

// ---- 常量 ----
var MAX_LIVES = 5;
var BOSS_SCORE = 3000;

// Boss 配置：每个 Boss 可有多个阶段，每阶段独立血量 + 技能池
var BOSS_CONFIG = [
    {   // BOSS 1 · 烈焰战机
        name: '烈焰战机', speed: 1.5,
        phases: [{ hp: 4500, skills: ['fan','ring','aim'] }]
    },
    {   // BOSS 2 · 暗影旋涡
        name: '暗影旋涡', speed: 2.0,
        phases: [{ hp: 7500, skills: ['spiral','cross','homing','ring'] }]
    },
    {   // BOSS 3 · 末日泰坦（3 阶段，血量巨大）
        name: '末日泰坦', speed: 1.2,
        phases: [
            { hp: 7000,  skills: ['laser','spread'],                  label: 'I'   },
            { hp: 8000,  skills: ['ring','spiral','cross'],            label: 'II'  },
            { hp: 11000, skills: ['laser','ring','spiral','summon','shield_burst','nova','nova2'], label: 'III' }  // 🌟 终阶：防御形态(shield_burst) + 输出形态(nova / nova2毁灭新星)
        ]
    }
];

// ---- 音频（懒加载，绝不让异常逃出） ----
var audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
    }
    return audioCtx;
}
function playSound(type) {
    var ac = getAudio();
    if (!ac) return;
    try {
        if (ac.state === 'suspended') ac.resume();
        var osc = ac.createOscillator(), gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        var now = ac.currentTime;
        var types = {
            shoot: ['square', 800, 200, 0.15, 0.08],
            explosion: ['sawtooth', 150, 30, 0.3, 0.3],
            powerup: ['sine', 400, 800, 0.2, 0.2],
            bossAlert: ['square', 200, 100, 0.3, 0.5]
        };
        var cfg = types[type];
        if (cfg) {
            osc.type = cfg[0];
            osc.frequency.setValueAtTime(cfg[1], now);
            osc.frequency.exponentialRampToValueAtTime(cfg[2], now + cfg[4]);
            gain.gain.setValueAtTime(cfg[3], now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + cfg[4]);
            osc.start(now); osc.stop(now + cfg[4]);
        }
    } catch (e) {}
}

// ---- 画布 ----
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
function resize() {
    canvas.width = Math.min(window.innerWidth, 480);
    canvas.height = Math.min(window.innerHeight, 720);
}
resize();
window.addEventListener('resize', resize);

// ---- 游戏状态 ----
var score = 0, lives = MAX_LIVES, running = false;
var bossActive = false, bossDefeatedCount = 0;
var keys = {};
// 🎮 触摸（手机）：相对拖动，支持上下左右全方向移动
var touchActive = false, touchPrevX = null, touchPrevY = null;
var touchDX = 0, touchDY = 0;
var powerLevel = 1, shield = false, bombs = 0, invincible = 0;
var bombCooldown = 0;          // 💣 使用冷却（帧数，10秒 = 600帧@60fps）
var BOMB_COOLDOWN_FRAMES = 600; // 10 秒冷却时长（使用后必须等 10 秒才能再次释放）
var BOMB_REGEN_FRAMES = 1800;   // 💣 每 30 秒(1800帧@60fps)自动恢复 1 颗存量
var bombRegenTimer = 0;         // 炸弹回复计时器（每满 30 秒 +1 颗，封顶 MAX_BOMBS）
// 🌀 主动技能：旋转（火力 Lv5 解锁）—— 按 Q / 点按钮释放，非自动
var spinActive = 0, spinCooldown = 0, playerSpinAngle = 0;
var SPIN_DURATION = 300, SPIN_COOLDOWN = 720;   // 持续 5 秒 / 冷却 12 秒；转速 0.5~3×（随火力）
// 🔴 主动技能：激光（火力 Lv10 解锁）—— 按 E / 点按钮释放，单道光束
var laserActive = 0, laserCooldown = 0, laserTick = 0;
var LASER_DURATION = 300, LASER_COOLDOWN = 900;  // 持续 5 秒 / 冷却 15 秒；3伤害 × 25次/秒
// 🔓 火力 Lv30「突破技」（主动技能，仅 Lv30 解锁）：使用后 → 直接开大 10 秒 + 移速×2 + 回 3 血
var breakActive = 0, breakCooldown = 0;
var BREAK_DURATION = 600;      // 持续 10 秒 @60fps（开大持续 10 秒）
var BREAK_COOLDOWN = 1800;     // 冷却 30 秒 @60fps
var BREAK_HEAL = 3;            // 使用后立即恢复 3 滴血
var BREAK_SPEED_MULT = 2;      // 移速倍率
var BREAK_BASE_SPEED = 5;      // 基准移速（player.speed 在激活期间 = 基准 × 倍率）
var player = { x: 0, y: 0, w: 36, h: 44, speed: 5, cooldown: 0 };
var bullets = [], enemyBullets = [], enemies = [], explosions = [], items = [], effects = [], warnings = [];
var trails = [];                    // 机翼后 / 子弹彩色尾迹粒子
// 🔥 开大（被动触发，不可手动）：攻击时概率触发，持续 2 秒，每秒 75 发子弹
var ultActive = 0, ultGrace = 0, ultFireAccum = 0, ultToggle = 0;
var ULT_DURATION = 180;             // 持续 3 秒 @60fps
var ULT_FIRE_RATE = 75;             // 每秒子弹数
var ULT_PROB_BASE = 0.02, ULT_PROB_LV5 = 0.03;  // Lv5+ 概率提升到 3%
var ULT_BIG_CHANCE = 0.01;         // Lv10 时「50 伤 + 彩虹」子弹占比 = 1%
// 💣 炸弹存储上限：3 → 10
var MAX_BOMBS = 10;
var START_BOMBS = 3; // 💣 开局自带 3 颗（之后每 30 秒回复 1 颗，封顶 10）
var ULT_BIG_DMG = 50;
var NORMAL_DMG = 10;               // 普通子弹伤害（敌机/Boss 统一）
var MAX_POWER = 30;                // 🔓 火力上限 Lv.30（Lv11~Lv29 无加成，仅 Lv30 突破）
function getUltProb() { return powerLevel >= 5 ? ULT_PROB_LV5 : ULT_PROB_BASE; }
// 🔓 是否处于「突破上限」状态：仅 Lv30 为真（Lv11~Lv29 均为 false，无任何加成）
function isBreakthrough() { return powerLevel >= MAX_POWER; }
// 🔓 Lv30 时开大 100% 发射 50 伤子弹；其余等级沿用 1% 概率
function getBigChance() { return isBreakthrough() ? 1.0 : ULT_BIG_CHANCE; }
function getWingSpan() { return 14 + Math.min(powerLevel, 8) * 2; }
var stars = [];
for (var si = 0; si < 60; si++) stars.push({ x: Math.random()*500, y: Math.random()*800, s: Math.random()*2+0.5, speed: Math.random()*2+0.5 });
var boss = null;
// 💖 爱心生成计时器（每 5 秒一次 10% 概率），避免与敌机刷新竞争
var heartSpawnTimer = 300;

// ---- 输入 ----
document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (!running) return;
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); useBomb(); }
    else if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); activateSpin(); }
    else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); activateLaser(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); activateBreak(); }
});
document.addEventListener('keyup', function(e) { keys[e.key] = false; });
// 🎮 相对拖动：手指移动量累加到 touchDX/touchDY，update 里应用到玩家（支持上下左右）
function onTouchStart(e) {
    e.preventDefault();
    var t = e.touches[0];
    touchActive = true; touchPrevX = t.clientX; touchPrevY = t.clientY;
}
function onTouchMove(e) {
    e.preventDefault();
    if (!touchActive || touchPrevX === null) return;
    var t = e.touches[0];
    var sx = canvas.width / window.innerWidth, sy = canvas.height / window.innerHeight;
    touchDX += (t.clientX - touchPrevX) * sx;
    touchDY += (t.clientY - touchPrevY) * sy;
    touchPrevX = t.clientX; touchPrevY = t.clientY;
}
function onTouchEnd(e) { e.preventDefault(); touchActive = false; touchPrevX = null; touchPrevY = null; }
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

// ---- 核心函数（全局，确保 onclick/监听器都能找到） ----
function initGame() {
    score = 0; lives = MAX_LIVES; bossActive = false; bossDefeatedCount = 0;
    powerLevel = 1; shield = false; bombs = START_BOMBS; invincible = 0; bombCooldown = 0; bombRegenTimer = 0;
    spinActive = 0; spinCooldown = 0; playerSpinAngle = 0;
    laserActive = 0; laserCooldown = 0; laserTick = 0;
    breakActive = 0; breakCooldown = 0; setBreakAura(false);
    ultActive = 0; ultGrace = 0; ultFireAccum = 0; ultToggle = 0; trails = [];
    bullets = []; enemyBullets = []; enemies = []; explosions = []; items = []; effects = []; warnings = [];
    heartSpawnTimer = 300; // 💖 重置爱心计时器
    boss = null;
    player.x = canvas.width / 2; player.y = canvas.height - 70; player.cooldown = 0;
    setDisplay('bossBar', 'none');
    updateHUD();
}

function startGame() {
    var ss = document.getElementById('startScreen');
    if (ss) ss.style.display = 'none';
    initGame();
    running = true;
    playSound('shoot');
}

function restart() {
    setDisplay('gameOver', 'none');
    setDisplay('victory', 'none');
    initGame();
    running = true;
    playSound('shoot');
}

function setDisplay(id, val) { var el = document.getElementById(id); if (el) el.style.display = val; }
function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }

function shoot() {
    // 弹道规则：
    //   🌀 旋转时 —— 所有子弹从机头沿机头朝向发射（螺旋弹幕）
    //   静止时   —— Lv1~Lv3 集中中间竖直；Lv4 两边扇形；Lv5~Lv10 中间+两边扇形
    var cx = player.x, cy = player.y - 22;
    var sp = 8; // 子弹速度标量

    // ===== 🌀 旋转：子弹从机头发射，方向 = 机头朝向（随自转角度变化）=====
    if (spinActive > 0) {
        var noseAngle = -Math.PI / 2 + playerSpinAngle;   // 机头朝向（弧度）
        var nx = cx + Math.sin(playerSpinAngle) * 22;      // 机头端点 x
        var ny = cy + 22 * (1 - Math.cos(playerSpinAngle)); // 机头端点 y（θ=0 时 = cy）
        var count = Math.min(powerLevel, 5);               // 火力越高弹幕越密
        var spread = 0.07;
        for (var ni = 0; ni < count; ni++) {
            var na = noseAngle + (ni - (count - 1) / 2) * spread;
            bullets.push({ x: nx - 1.5, y: ny, w: 3, h: 10, speed: sp, vx: Math.cos(na) * sp, vy: Math.sin(na) * sp, damage: NORMAL_DMG });
        }
        playSound('shoot');
        return;
    }

    if (powerLevel <= 3) {
        // 集中在中间，全部竖直向上（旋转时也统一从机头发射）
        var n = powerLevel; // 1/2/3
        var spacing = 6;
        var startX = cx - (n - 1) * spacing / 2;
        for (var i = 0; i < n; i++) {
            var bx = startX + i * spacing;
            bullets.push({ x: bx - 1.5, y: cy, w: 3, h: 10, speed: sp, vx: 0, vy: -sp, damage: NORMAL_DMG });
        }
    } else if (powerLevel === 4) {
        // 两边扇形发射：左右各 2 根（散射收敛到约 ±9°，总张角约 18°）
        var offs4 = [-2, -1, 1, 2]; // 相对 -90° 的偏移档位
        var spread = 0.078;
        for (var j = 0; j < offs4.length; j++) {
            var aj = -Math.PI/2 + offs4[j] * spread;
            bullets.push({ x: cx - 1.5, y: cy, w: 3, h: 10, speed: sp, vx: Math.cos(aj)*sp, vy: Math.sin(aj)*sp, damage: NORMAL_DMG });
        }
    } else {
        // Lv5~Lv10：中间 1 根竖直 + 左右各 2 根扇形（共 5 根）
        bullets.push({ x: cx - 1.5, y: cy, w: 3, h: 10, speed: sp, vx: 0, vy: -sp, damage: NORMAL_DMG }); // 正中
        var offs5 = [-2, -1, 1, 2];
        var spread5 = 0.078;
        for (var k = 0; k < offs5.length; k++) {
            var ak = -Math.PI/2 + offs5[k] * spread5;
            bullets.push({ x: cx - 1.5, y: cy, w: 3, h: 10, speed: sp, vx: Math.cos(ak)*sp, vy: Math.sin(ak)*sp, damage: NORMAL_DMG });
        }
    }
    playSound('shoot');
}

// 💬 临时提示气泡
var toastTimer = 0;
function flashTip(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1500);
}

// 🌀 旋转技能：Lv5 解锁，手动释放。激活后战机高速自转（0.5~3×随火力），期间无敌
function activateSpin() {
    if (!running) return;
    if (powerLevel < 5) { flashTip('🔒 旋转需火力 Lv.5 解锁'); return; }
    if (spinActive > 0) return;      // 正在释放中
    if (spinCooldown > 0) return;    // 冷却中
    spinActive = SPIN_DURATION; spinCooldown = SPIN_COOLDOWN;
    invincible = Math.max(invincible, SPIN_DURATION); // 旋转期间无敌
    playSound('powerup'); updateHUD();
}

// 🔓 火力 Lv30「突破技」：仅 Lv30 可用，使用后 → 直接开大 10 秒 + 移速×2 + 恢复 3 滴血
//   - 直接开大：内部以「开大满配」运行（每秒 75 发，Lv30 → 100% 50 伤子弹），持续 10 秒
//   - 移速×2：激活期间 player.speed = BREAK_BASE_SPEED × 2 = 10
//   - 回 3 血：使用后瞬间 lives += 3（受 MAX_LIVES 上限约束）
function activateBreak() {
    if (!running) return;
    if (!isBreakthrough()) { flashTip('🔒 突破技需火力 Lv.30 解锁'); return; }
    if (breakActive > 0) return;   // 正在释放中
    if (breakCooldown > 0) return; // 冷却中

    startBreakUltimate();
    // ② 移速 ×2

    // ③ 恢复 3 滴血

    lives = Math.min(MAX_LIVES, lives + BREAK_HEAL);

    if (healed > 0) flashTip('💖 +' + healed + ' 生命');
    // 持续时间 / 冷却 / 辉光
    breakActive = BREAK_DURATION;
    breakCooldown = BREAK_COOLDOWN;

    playSound('powerup'); updateHUD();
}

// 激光每 tick 的伤害判定（穿透：沿光束方向的敌机全部受伤；旋转时激光随之旋转，命中同步）
function applyLaserHit() {
    var angle = spinActive > 0 ? playerSpinAngle : 0;
    var dx = Math.sin(angle), dy = -Math.cos(angle);  // 光束方向（局部朝上 → 世界）
    var len = player.y;                                // 到屏幕顶端的长度
    var half = 8, px = player.x, py = player.y, dead = [];
    enemies.forEach(function(e, i) {
        var ex = e.x + e.w/2, ey = e.y + e.h/2;
        var t = (ex - px) * dx + (ey - py) * dy;       // 投影到光束
        if (t < 0 || t > len) return;
        var projX = px + dx * t, projY = py + dy * t;
        var dist = Math.sqrt((ex - projX) * (ex - projX) + (ey - projY) * (ey - projY));
        if (dist < half + Math.max(e.w, e.h) / 2) {
            e.hp -= 3;
            if (e.hp <= 0) dead.push(i);
        }
    });
    dead.forEach(function(ei) {
        var e = enemies[ei]; if (!e) return;
        score += e.type === 'heavy' ? 40 : 15;
        explode(e.x + e.w/2, e.y + e.h/2);
        if (e.type === 'heavy' || Math.random() < 0.15) spawnItem(e.x + e.w/2, e.y + e.h/2);
        // 🔓 突破上限后：击杀敌机有概率直接掉落火力道具（加速 Lv11~Lv29 爬升）
        if (isBreakthrough() && powerLevel < MAX_POWER && Math.random() < 0.06) {
            spawnItem(e.x + e.w/2, e.y + e.h/2, 'power');
        }
    });

    enemies = enemies.filter(function(e, i) { return dead.indexOf(i) === -1; });
    // Boss 命中（沿光束线段距离判定）
    if (bossActive && boss) {
        var bx = boss.x + boss.w/2, by = boss.y + boss.h/2;
        var bt = (bx - px) * dx + (by - py) * dy;
        if (bt > 0 && bt < len) {
            var bprojX = px + dx * bt, bprojY = py + dy * bt;
            var bdist = Math.sqrt((bx - bprojX) * (bx - bprojX) + (by - bprojY) * (by - bprojY));
            if (bdist < half + Math.max(boss.w, boss.h) / 2) damageBoss(3);
        }
    }
}

// 触发条件：普通攻击时概率触发（Lv<5: 2%，Lv≥5: 3%），持续 2 秒

// 开大子弹：从机翼下两个加特林交替发射，每发在扇形范围内随机角度 —— 持续 3 秒，每秒 75 发
// Lv10 时部分子弹 = 50 伤 + 彩虹尾迹；🌀 旋转时随整机旋转沿机头朝向扇形散射
function spawnUltBullet() {
    var left = (ultToggle++ % 2 === 0);
    var ws = getWingSpan();
    var lx = left ? -ws : ws, ly = 10; // 加特林局部坐标（相对玩家中心）
    var wx, wy, sp = 9;
    // 基础朝向：旋转时 = 机头朝向；静止时 = 竖直向上
    var baseAngle = spinActive > 0 ? (-Math.PI / 2 + playerSpinAngle) : -Math.PI / 2;
    // 🔑 扇形随机角度：每发在 ±FAN_HALF 内随机，形成散射弹幕
    var FAN_HALF = 0.42; // 约 ±24°
    var angle = baseAngle + (Math.random() - 0.5) * 2 * FAN_HALF;
    if (spinActive > 0) {
        // 整机旋转 → 加特林世界坐标取旋转后位置
        var c = Math.cos(playerSpinAngle), s = Math.sin(playerSpinAngle);
        wx = player.x + lx * c - ly * s;
        wy = player.y + lx * s + ly * c;
    } else {
        wx = player.x + lx; wy = player.y + ly;
    }
    var vx = Math.cos(angle) * sp, vy = Math.sin(angle) * sp;
    var isBig = (powerLevel >= 10 && Math.random() < getBigChance());   // 🔓 Lv30 → 100% 出 50 伤子弹
    var dmg = isBig ? ULT_BIG_DMG : NORMAL_DMG;
    bullets.push({
        x: wx - 3, y: wy, w: isBig ? 6 : 3, h: isBig ? 14 : 10,
        speed: sp, vx: vx, vy: vy,
        damage: dmg, rainbow: isBig, ult: true
    });
}

// 机翼后尾迹：颜色随火力等级变化，Lv10 为彩色循环；结束后清除
var WING_TRAIL_COLORS = { 1:'#0af', 2:'#0cf', 3:'#0fc', 4:'#0f8', 5:'#0af', 6:'#0fc', 7:'#0f8', 8:'#ff0', 9:'#f80', 10:null }; // 10=null→彩色循环
function spawnWingTrails() {
    var ws = getWingSpan(), baseCol = (powerLevel >= 10) ? null : (WING_TRAIL_COLORS[powerLevel] || '#0af');
    [-ws, ws].forEach(function(dx) {
        trails.push({
            x: player.x + dx, y: player.y + 16,
            vx: (Math.random() - 0.5) * 0.6, vy: 1 + Math.random(),

        });
    });
}

// 💣 炸弹：对所有敌机造成 10 点伤害 + 清除全屏子弹（含预警）+ 对 Boss 造成 10 点伤害
function useBomb() {

            if (e.type === 'heavy' || Math.random() < 0.15) spawnItem(e.x + e.w/2, e.y + e.h/2);

// 💖 道具类型：power / shield
// ⚠️ 炸弹不再从天上掉落（避免刷炸弹），只能通过初始存量使用
// ⚠️ 爱心(heart)不再由打怪掉落——爱心只靠「每5秒10%自然生成」一种来源

function spawnItem(x, y, forcedType) { items.push({ x: x, y: y, type: forcedType || randomItemType(), w: 24, h: 24, speed: 2 }); }

// ---- Boss ----
function updateBossBarText() {
    var bt = document.getElementById('bossBarText');
    if (!bt || !boss) return;
    var phaseLabel = '';
    if (boss.kind === 2) phaseLabel = ' · 阶段' + (boss.phase+1) + '/3';
    var total = Math.max(0, Math.round(boss.totalHp)) + '/' + boss.totalMaxHp;
    bt.textContent = '👹 BOSS ' + (boss.kind+1) + '/3 · ' + BOSS_CONFIG[boss.kind].name + phaseLabel + ' · ' + total;
}

function spawnBoss() {
    if (!running) return;
    bossActive = true; playSound('bossAlert');
    var kind = bossDefeatedCount;
    var cfg = BOSS_CONFIG[kind];
    var totalMax = 0;
    for (var pi = 0; pi < cfg.phases.length; pi++) totalMax += cfg.phases[pi].hp;
    var firstHp = cfg.phases[0].hp;
    boss = {
        kind: kind, x: canvas.width/2-40, y: -80, w: 80, h: 70,
        hp: firstHp, maxHp: firstHp, totalHp: totalMax, totalMaxHp: totalMax,
        phase: 0, skillTimer: 0, skillIndex: 0,
        speed: cfg.speed, enterComplete: false, phaseTransition: 60,
        spiralActive: 0, spiralAngle: 0,
        novaCharge: 0, novaArm: 0,
        // 🌟 末日泰坦 III 双重形态：防御(能量护盾) + 毁灭(nova2)
        energyShield: 0, energyShieldMax: 0,   // 防御形态：可吸收伤害的能量护盾值
        shieldBurst: 0,                         // shield_burst 展开剩余帧数
        nova2Charge: 0, nova2Arm: 0,            // 毁灭形态：nova2 蓄力倒计时
        formCooldown: 0,                        // 形态切换冷却（避免连续防御/毁灭）
        // 🎲 随机移动：速度分量 + 换向计时
        vx: (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random()*0.6),
        vy: (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random()*0.4),
        dirTimer: 50
    };
    setDisplay('bossBar', 'block');
    updateBossBarText();
    updateBossBar();
}

// Boss 受击（含阶段切换）
function damageBoss(amt) {
    if (!boss || boss.phaseTransition > 0) return;
    // 🛡️ 防御形态「量子护盾」：伤害先被护盾吸收，仅 15% 穿透；护盾归零后正常扣血
    if (boss.phase === 2 && boss.energyShield > 0) {
        var reduced = Math.max(1, Math.round(amt * 0.15));   // 85% 减伤
        var absorbed = amt - reduced;
        boss.energyShield -= absorbed;
        if (boss.energyShield < 0) {
            // 护盾被击穿：溢出伤害转为破盾反击（立即释放一圈反击弹幕）
            spawnShieldCounter();
            boss.energyShield = 0; boss.shieldBurst = 0;
            effects.push({ kind: 'shieldBreak', x: boss.x + boss.w/2, y: boss.y + boss.h/2, timer: 36, maxTimer: 36 });
            playSound('explosion');
        }
        boss.hp -= reduced;
        boss.totalHp -= reduced;
    } else {
        boss.hp -= amt;
        boss.totalHp -= amt;
    }
    if (boss.hp <= 0) {
        var cfg = BOSS_CONFIG[boss.kind];
        if (boss.phase < cfg.phases.length - 1) {
            // 进入下一阶段
            boss.phase++;
            boss.hp = cfg.phases[boss.phase].hp;
            boss.maxHp = boss.hp;
            boss.skillTimer = 0; boss.skillIndex = 0; boss.spiralActive = 0; boss.novaCharge = 0;
            boss.nova2Charge = 0; boss.shieldBurst = 0; boss.energyShield = 0; boss.energyShieldMax = 0; boss.formCooldown = 0;  // 🌟 重置双重形态
            boss.phaseTransition = 90; // 约1.5秒过渡（无敌喘息）
            playSound('bossAlert');
            updateBossBarText();
        } else {
            defeatBoss();
        }
    }
    updateBossBar();
}

function updateBossBar() {
    var bbf = document.getElementById('bossBarFill');
    if (bbf && boss) {
        var pct = (boss.totalHp / boss.totalMaxHp) * 100;
        bbf.style.width = Math.max(0, pct) + '%';
    }
    updateBossBarText(); // 同步刷新血量数字
}

function defeatBoss() {
    bossActive = false; bossDefeatedCount++; score += 500;
    explode(boss.x+boss.w/2, boss.y+boss.h/2); explode(boss.x+20, boss.y+boss.h/2+10); explode(boss.x+boss.w-20, boss.y+boss.h/2+10);
    playSound('explosion');
    for (var i = 0; i < 3; i++) spawnItem(boss.x+boss.w/2+(Math.random()-0.5)*60, boss.y+boss.h/2+(Math.random()-0.5)*40);
    boss = null; setDisplay('bossBar', 'none');
    if (bossDefeatedCount >= 3) {
        running = false; setText('vicScore', score); setDisplay('victory', 'flex'); checkLeaderboard();
    }
    updateHUD();
}

// ---- Boss 技能释放 ----
function castSkill(sk) {
    if (!boss) return;
    var bx = boss.x + boss.w/2, by = boss.y + boss.h;
    var i, angle, arm;
    switch (sk) {
        case 'fan': // 扇形散射
            for (i = -2; i <= 2; i++) {
                angle = Math.PI/2 + i * 0.16;
                enemyBullets.push({ x: bx, y: by, w: 5, h: 5, speed: 3, vx: Math.cos(angle)*3, vy: Math.sin(angle)*3 });
            }
            break;
        case 'spread': // 宽扇形
            for (i = -3; i <= 3; i++) {
                angle = Math.PI/2 + i * 0.13;
                enemyBullets.push({ x: bx, y: by, w: 5, h: 5, speed: 3.2, vx: Math.cos(angle)*3.2, vy: Math.sin(angle)*3.2 });
            }
            break;
        case 'ring': // 环形爆发
            for (i = 0; i < 14; i++) {
                angle = (Math.PI*2 / 14) * i;
                enemyBullets.push({ x: bx, y: by, w: 6, h: 6, speed: 2.2, vx: Math.cos(angle)*2.2, vy: Math.sin(angle)*2.2, glow: true });
            }
            break;
        case 'aim': // 瞄准射击（朝玩家）
            for (i = -1; i <= 1; i++) {
                angle = Math.atan2(player.y - by, player.x - bx) + i * 0.12;
                enemyBullets.push({ x: bx, y: by, w: 6, h: 6, speed: 3.5, vx: Math.cos(angle)*3.5, vy: Math.sin(angle)*3.5 });
            }
            break;
        case 'spiral': // 持续双向螺旋（激活一段时间）
            boss.spiralActive = 55; boss.spiralAngle = 0;
            break;
        case 'cross': // 交叉弹幕（左右交替倾泻）
            enemyBullets.push({ x: bx-30, y: by, w: 5, h: 10, speed: 3.5 });
            enemyBullets.push({ x: bx+30, y: by, w: 5, h: 10, speed: 3.5 });
            break;
        case 'homing': // 追踪弹
            enemyBullets.push({ x: bx, y: by, w: 8, h: 8, speed: 2, vx: 0, vy: 2, homing: true });
            enemyBullets.push({ x: bx, y: by, w: 8, h: 8, speed: 2, vx: 0, vy: 2, homing: true });
            break;
        case 'laser': // 激光：预警线 -> 高速直射
            var lx = player.x + (Math.random()-0.5)*50;
            warnings.push({ x: lx, timer: 28 });
            setTimeout(function(){
                if (running && bossActive && boss && boss.kind === 2) {
                    enemyBullets.push({ x: lx-3, y: by, w: 7, h: 34, speed: 13, laser: true });
                }
            }, 450);
            break;
        case 'summon': // 召唤小怪
            spawnEnemyAt(boss.x + 10, 'heavy');
            spawnEnemyAt(boss.x + boss.w - 10, 'scout');
            break;
        case 'nova': // 🌟 末日新星：蓄力后爆发巨型环形弹幕 + 追踪内圈
            boss.novaCharge = 90;   // 1.5 秒蓄力（无敌预警）
            boss.novaArm = 0;
            playSound('bossAlert');
            break;

        // 🛡️ 防御形态「量子护盾爆发」：展开巨大能量护盾，期间大幅减伤 + 反弹弹幕
        case 'shield_burst':
            if (boss.phase !== 2) break;                    // 仅末日泰坦 III 可用
            boss.shieldBurst = 150;                         // 持续 2.5 秒
            boss.energyShield = 6000;                       // 护盾值 ≈ 一整个阶段血量
            boss.energyShieldMax = 6000;
            boss.formCooldown = 300;                        // 护盾结束后 5 秒才再切形态
            playSound('powerup');
            effects.push({ kind: 'shieldExpand', x: bx, y: by, timer: 40, maxTimer: 40, r: 20 });
            break;

        // 💥 毁灭形态「末日新星Ⅱ」：蓄力 2.5 秒后爆发毁灭级全屏弹幕（终极输出）
        case 'nova2':
            if (boss.phase !== 2) break;
            boss.nova2Charge = 150;                          // 2.5 秒蓄力（比 nova 更长、更危险）
            boss.nova2Arm = Math.random() * Math.PI;         // 随机起始角度，避免固定朝向
            playSound('bossAlert');
            effects.push({ kind: 'flash', timer: 12, maxTimer: 12 });
            break;
    }
}

function updateBossSkills() {
    if (!boss) return;
    var bx = boss.x + boss.w/2, by = boss.y + boss.h;

    // 持续螺旋弹幕
    if (boss.spiralActive > 0) {
        boss.spiralActive--;
        boss.spiralAngle += 0.28;
        for (arm = 0; arm < 2; arm++) {
            var sa = boss.spiralAngle + arm * Math.PI;
            enemyBullets.push({ x: bx, y: by, w: 5, h: 5, speed: 2.6, vx: Math.cos(sa)*2.6, vy: Math.sin(sa)*2.6 });
        }
    }

    // 🛡️ 防御形态「量子护盾爆发」：护盾存在期间大幅减伤，玩家子弹伤害绝大部分被吸收；
    //    护盾存在时每 12 帧自动反弹一圈反击弹幕（输出不归零，攻防一体）
    if (boss.energyShield > 0) {
        if ((boss.skillTimer % 12 === 0)) {
            for (var ci = -2; ci <= 2; ci++) {
                var ca = Math.PI/2 + ci * 0.22;
                enemyBullets.push({ x: bx, y: by, w: 6, h: 6, speed: 3.4, vx: Math.cos(ca)*3.4, vy: Math.sin(ca)*3.4, glow: true, shield: true });
            }
        }
    }
    if (boss.shieldBurst > 0) {
        boss.shieldBurst--;
        if (boss.shieldBurst <= 0) { boss.energyShield = 0; }  // 持续时间到 → 护盾消散
    }
    if (boss.formCooldown > 0) boss.formCooldown--;

    // 🌟 末日新星（nova）：蓄力倒计时 → 0 时爆发巨型环形弹幕 + 内圈瞄准弹
    if (boss.novaCharge > 0) {
        boss.novaCharge--;
        if (boss.novaCharge <= 0) {
            var novaCount = 40;
            for (i = 0; i < novaCount; i++) {
                var na = (Math.PI * 2 / novaCount) * i + (boss.novaArm || 0);
                enemyBullets.push({ x: bx, y: by, w: 8, h: 8, speed: 3.2, vx: Math.cos(na) * 3.2, vy: Math.sin(na) * 3.2, glow: true });
            }
            // 内圈：6 发朝玩家的瞄准弹
            for (i = -2; i <= 3; i++) {
                var aa = Math.atan2(player.y - by, player.x - bx) + i * 0.18;
                enemyBullets.push({ x: bx, y: by, w: 7, h: 7, speed: 4, vx: Math.cos(aa) * 4, vy: Math.sin(aa) * 4, glow: true });
            }
            playSound('explosion');
            effects.push({ kind: 'flash', timer: 20, maxTimer: 20 });
        }
        return; // 蓄力/爆发当拍不释放其它技能
    }

    // 💥 毁灭形态「末日新星Ⅱ」：2.5 秒蓄力 → 72 路毁灭弹幕 + 12 发精准瞄准 + 黑红膨胀特效
    if (boss.nova2Charge > 0) {
        boss.nova2Charge--;
        // 蓄力期间持续吸附式预警：缓慢向玩家方向微调，增强压迫感
        var nova2Prog = 1 - boss.nova2Charge / 150;
        boss.nova2Arm += 0.04;                              // 能量漩涡持续旋转
        if (boss.nova2Charge <= 0) {
            var nova2Count = 72;                            // 比 nova 更密的环形覆盖
            for (i = 0; i < nova2Count; i++) {
                var n2a = (Math.PI * 2 / nova2Count) * i + (boss.nova2Arm || 0);
                enemyBullets.push({ x: bx, y: by, w: 9, h: 9, speed: 3.4, vx: Math.cos(n2a) * 3.4, vy: Math.sin(n2a) * 3.4, glow: true, heavy: true });
            }
            // 内圈：12 发高精度瞄准弹（比 nova 更致命）
            var nova2Inner = 12;
            for (i = -nova2Inner/2; i < nova2Inner/2; i++) {
                var n2aa = Math.atan2(player.y - by, player.x - bx) + i * 0.11;
                enemyBullets.push({ x: bx, y: by, w: 8, h: 8, speed: 4.2, vx: Math.cos(n2aa) * 4.2, vy: Math.sin(n2aa) * 4.2, glow: true, heavy: true });
            }
            playSound('explosion');
            effects.push({ kind: 'nova2Boom', x: bx, y: by, timer: 60, maxTimer: 60, prog: 0 });  // 💥 黑红膨胀毁灭特效
            effects.push({ kind: 'flash', timer: 30, maxTimer: 30 });
            boss.formCooldown = 240;                        // 爆发后 4 秒冷却，喘息窗口
        }
    }

    if (boss.phaseTransition > 0) {
        boss.phaseTransition--;
        return; // 阶段过渡期间不攻击
    }

    var phaseCfg = BOSS_CONFIG[boss.kind].phases[boss.phase];
    var skills = phaseCfg.skills;
    // 阶段越高、越是Boss3，攻速越快
    var interval = 75;
    if (boss.kind === 2) interval = boss.phase === 2 ? 48 : 62;
    else if (boss.kind === 1) interval = 58;

    boss.skillTimer++;
    if (boss.skillTimer > interval) {
        var sk;
        // 🌟 末日泰坦 III：权重随机技能池，形态技(shield_burst/nova2)低频触发，避免连续防御/毁灭
        if (boss.kind === 2 && boss.phase === 2 && boss.formCooldown <= 0) {
            var r = Math.random();
            if (boss.energyShield <= 0 && r < 0.14) sk = 'shield_burst';   // 14% 防御形态
            else if (r < 0.30) sk = 'nova2';                                // 16% 毁灭形态
            else if (r < 0.45) sk = 'nova';                                // 15% 普通新星
        }
        if (!sk) sk = skills[boss.skillIndex % skills.length];
        castSkill(sk);
        boss.skillIndex++;
        boss.skillTimer = 0;
    }
}

function collide(a, b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

// 🛡️ 破盾反击：护盾被击穿时向四周爆发一圈密集弹幕（攻防一体的代价）
function spawnShieldCounter() {
    if (!boss) return;
    var bx = boss.x + boss.w/2, by = boss.y + boss.h;
    for (var ci = 0; ci < 24; ci++) {
        var ca = (Math.PI * 2 / 24) * ci;
        enemyBullets.push({ x: bx, y: by, w: 7, h: 7, speed: 3.6, vx: Math.cos(ca)*3.6, vy: Math.sin(ca)*3.6, glow: true, shield: true });
    }
}
function explode(x, y) { explosions.push({ x: x, y: y, r: 2, maxR: 20+Math.random()*15, alpha: 1 }); }

function hitPlayer() {
    if (invincible > 0) return;
    if (shield) { shield = false; invincible = 60; playSound('powerup'); updateHUD(); return; }
    lives--; explode(player.x, player.y); playSound('explosion');
    if (lives <= 0) { running = false; checkLeaderboard(); setText('finalScore', score); setDisplay('gameOver', 'flex'); }
    else invincible = 90;
    updateHUD();
}

function checkLeaderboard() {
    try {
        var lb = JSON.parse(localStorage.getItem('plane_lb') || '[]');
        var isNew = !lb.length || score > Math.max.apply(null, lb);
        setDisplay('newRecord', isNew ? 'block' : 'none');
        if (isNew) { lb.push(score); lb.sort(function(a,b){return b-a;}); lb = lb.slice(0,5); localStorage.setItem('plane_lb', JSON.stringify(lb)); }
        var lbDiv = document.getElementById('leaderboard');
        if (lbDiv && lb.length) lbDiv.innerHTML = '🏆 TOP 5<br>' + lb.map(function(s,i){ return (i+1)+'. '+s; }).join('<br>');
    } catch (e) {}
}

var hudFrame = 0;
function updateHUD(force) {
    // 🚀 节流：默认每 6 帧(约0.1秒)刷新一次 DOM，避免每帧操作 layout 造成卡顿
    hudFrame++;
    if (!force && hudFrame % 6 !== 0) return;
    setText('scoreVal', score);
    // 红色长条：宽度按比例，旁边 x当前血量
    var fill = document.getElementById('lifeBarFill');
    if (fill) fill.style.width = Math.max(0, lives / MAX_LIVES * 100) + '%';
    setText('livesVal', 'x' + Math.max(0, lives));
    setText('powerVal', powerLevel); setText('bombVal', bombs);
    var powerWrap = document.getElementById('powerWrap');
    if (powerWrap) powerWrap.classList.toggle('breakthrough', isBreakthrough()); // 🔓 Lv30 显示「（突破上限）」
    updateBombButton(); // 💣 同步炸弹按钮（数量 / 冷却倒计时）
    updateSkillButtons(); // 🌀🔴 同步技能按钮（解锁 / 冷却 / 激活）
}

// 🌀🔴 技能按钮：冷却中显示剩余秒数并置灰，未解锁显示 Lv，就绪显示图标
function updateSkillButtons() {
    updateOneSkillButton('spinBtn', spinCooldown, powerLevel >= 5, '🌀', 'Lv5');
    updateOneSkillButton('laserBtn', laserCooldown, powerLevel >= 10, '🔴', 'Lv10');
    updateOneSkillButton('breakBtn', breakCooldown, isBreakthrough(), '⚡', 'Lv30');
    setBreakAura(breakActive > 0);
}
function updateOneSkillButton(id, cd, unlocked, iconTxt, lockTxt) {
    var btn = document.getElementById(id);
    if (!btn) return;
    var ic = btn.querySelector('.ic');
    if (cd > 0) {
        btn.classList.add('disabled');
        if (ic) ic.textContent = Math.ceil(cd / 60);
    } else if (unlocked) {
        btn.classList.remove('disabled');
        if (ic) ic.textContent = iconTxt;
    } else {
        btn.classList.remove('disabled');
        if (ic) ic.textContent = lockTxt;
    }
}

// 💣 炸弹按钮显示：冷却中显示剩余秒数并置灰，否则显示 💣+数量
function updateBombButton() {
    var btn = document.getElementById('bombBtn');
    var icon = document.getElementById('bombIcon');
    var bc = document.getElementById('bombCount');
    if (!btn) return;
    if (bombCooldown > 0) {
        var sec = Math.ceil(bombCooldown / 60); // 帧 -> 秒（60fps）
        if (icon) icon.textContent = sec;
        if (bc) bc.textContent = '';
        btn.className = 'bomb-btn disabled';
    } else if (bombs >= MAX_BOMBS) {
        if (icon) icon.textContent = '💣';
        if (bc) bc.textContent = bombs;
        btn.className = 'bomb-btn';
    } else {
        // 未达上限且可用：显示「距下次回复的秒数」，让玩家感知 30 秒回复节奏
        var regenSec = Math.ceil((BOMB_REGEN_FRAMES - bombRegenTimer) / 60);
        if (icon) icon.textContent = '💣';
        if (bc) bc.textContent = bombs + ' · ' + regenSec + 's';
        btn.className = 'bomb-btn';
    }
}

function update() {
    if (!running) return;
    if (keys['ArrowLeft']||keys['a']||keys['A']) player.x -= player.speed;
    if (keys['ArrowRight']||keys['d']||keys['D']) player.x += player.speed;
    if (keys['ArrowUp']||keys['w']||keys['W']) player.y -= player.speed;
    if (keys['ArrowDown']||keys['s']||keys['S']) player.y += player.speed;
    // 🎮 触摸拖动（相对位移，支持上下左右全方向移动）
    if (touchActive) { player.x += touchDX; player.y += touchDY; touchDX = 0; touchDY = 0; }
    player.x = Math.max(20, Math.min(canvas.width-20, player.x));
    player.y = Math.max(40, Math.min(canvas.height-30, player.y));
    // 🔓 突破技辉光跟随玩家
    if (breakActive > 0) {
        var aura = document.getElementById('breakAura');
        if (aura && aura.classList.contains('on')) {
            aura.style.left = player.x + 'px';
            aura.style.top = player.y + 'px';
        }
    }
    if (invincible > 0) invincible--;
    if (bombCooldown > 0) { bombCooldown--; updateBombButton(); } // 💣 炸弹冷却倒计时

    // 🌀 旋转：累计自转角度（转速 0.5~3× 随火力）
    if (spinActive > 0) {
        spinActive--;
        var spinMult = (powerLevel < 5) ? 0 : (powerLevel - 4) * 0.5;
        playerSpinAngle += 0.06 * spinMult;
    }
    if (spinCooldown > 0) spinCooldown--;
    // 🔴 激光：持续期间每帧累加 25，满 60 触发一次 → 25 次/秒；伤害 3
    if (laserActive > 0) {
        laserActive--;
        laserTick += 25;
        if (laserTick >= 60) { laserTick -= 60; applyLaserHit(); }
    }
    if (laserCooldown > 0) laserCooldown--;
    // 🔓 突破技：持续时间倒计时 + 移速恢复 + 辉光
    if (breakActive > 0) {
        breakActive--;
        if (breakActive <= 0) {
            // 结束：恢复基准移速、关闭辉光、清理机翼尾迹
            player.speed = BREAK_BASE_SPEED;
            setBreakAura(false);
            trails = [];
            flashTip('⚡ 突破技结束');
        }
    }
    if (breakCooldown > 0) breakCooldown--;
    updateSkillButtons();

    // ===== 发射逻辑 =====
    // 🔴 使用激光时不发射任何子弹（含开大）
    if (laserActive <= 0) {
        if (ultActive > 0) {
            // 🔥 开大：每秒 75 发，从机翼下两个加特林交替发射
            ultFireAccum += ULT_FIRE_RATE / 60;
            while (ultFireAccum >= 1) { ultFireAccum -= 1; spawnUltBullet(); }
            spawnWingTrails();
        } else {
            // 普通射击（旋转时子弹从机头发射）
            var cd = powerLevel <= 5 ? 16 : Math.max(12, 16 - (powerLevel-5)*1.0);
            if (player.cooldown <= 0) {
                shoot(); player.cooldown = cd;
                // 🎲 攻击时概率开大（被动触发，不可手动）
                if (ultGrace <= 0 && Math.random() < getUltProb()) startUltimate();
            }
            player.cooldown--;
        }
    }
    // 开大计时：结束 → 进入 1 秒 Grace 并清除机翼尾迹
    if (ultActive > 0) {
        ultActive--;
        if (ultActive <= 0) { ultGrace = 60; trails = []; }
    }
    if (ultGrace > 0) ultGrace--;

    bullets.forEach(function(b) { b.x += b.vx || 0; b.y += b.vy || -b.speed; });
    bullets = bullets.filter(function(b) { return b.y > -15 && b.x > -10 && b.x < canvas.width+10; });

    if (!bossActive && score >= BOSS_SCORE*(bossDefeatedCount+1) && bossDefeatedCount < 3) spawnBoss();
    if (!bossActive && Math.random() < 0.028) spawnEnemy();
    // 💖 每 5 秒(300帧)判定一次：10% 概率在上方生成一个爱心道具
    heartSpawnTimer--;
    if (heartSpawnTimer <= 0) {
        heartSpawnTimer = 300; // 5 秒 @60fps
        if (Math.random() < 0.10) {
            var hx = 40 + Math.random() * (canvas.width - 80);
            items.push({ x: hx, y: -20, type: 'heart', w: 24, h: 24, speed: 1.6 });
        }
    }
    // 💣 每 30 秒(1800帧)自动恢复 1 颗炸弹，封顶 MAX_BOMBS（独立计时，不受使用冷却影响）
    if (bombs < MAX_BOMBS) {
        bombRegenTimer++;
        if (bombRegenTimer >= BOMB_REGEN_FRAMES) {
            bombRegenTimer = 0;
            bombs++;
            updateHUD(true); // 立即刷新数量
        }
    } else {
        bombRegenTimer = 0; // 已满，重置计时（下次消耗后重新累计 30 秒）
    }

    // 敌机更新（按类型区分射击）
    enemies.forEach(function(e) {
        e.y += e.speed; e.shootTimer++;
        var interval = e.type === 'heavy' ? e.shootInterval : e.shootInterval;
        if (e.shootTimer > interval) {
            if (e.type === 'heavy') {
                // 重炮手：发射较粗较快的弹幕（朝玩家略微瞄准）
                var ha = Math.atan2(player.y - (e.y+e.h), player.x - (e.x+e.w/2));
                enemyBullets.push({ x: e.x+e.w/2-2, y: e.y+e.h, w: 6, h: 10, speed: 3.5, vx: Math.cos(ha)*3.5, vy: Math.sin(ha)*3.5 });
            } else {
                enemyBullets.push({ x: e.x+e.w/2-1.5, y: e.y+e.h, w: 3, h: 8, speed: 3 });
            }
            e.shootTimer = 0;
        }
    });
    enemies = enemies.filter(function(e) { return e.y < canvas.height+60; });

    // Boss AI + 技能：进场后在上半屏随机方向移动
    if (bossActive && boss) {
        if (!boss.enterComplete) {
            boss.y += 2; if (boss.y >= 55) boss.enterComplete = true;
        } else {
            // 🎲 每隔一段时间随机换新方向
            boss.dirTimer--;
            if (boss.dirTimer <= 0) {
                boss.vx = (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random()*0.7);
                boss.vy = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random()*0.5);
                boss.dirTimer = 50 + Math.random()*80;
            }
            boss.x += boss.vx * boss.speed;
            boss.y += boss.vy * boss.speed;
            // 限制在屏幕上半部分（y 约 40 ~ 高度*0.5）
            var topY = 40, botY = canvas.height * 0.5 - boss.h - 10;
            if (botY < topY + 20) botY = topY + 20;
            if (boss.y < topY) { boss.y = topY; boss.vy = Math.abs(boss.vy); }
            if (boss.y > botY) { boss.y = botY; boss.vy = -Math.abs(boss.vy); }
            var leftX = 30, rightX = canvas.width - boss.w - 30;
            if (boss.x < leftX) { boss.x = leftX; boss.vx = Math.abs(boss.vx); }
            if (boss.x > rightX) { boss.x = rightX; boss.vx = -Math.abs(boss.vx); }

            updateBossSkills();
        }
    }

    // 道具
    items.forEach(function(it) { it.y += it.speed; });
    items = items.filter(function(it) { return it.y < canvas.height+30; });
    var pHit = { x: player.x-12, y: player.y-20, w: 24, h: 40 };
    items.forEach(function(it) {
        if (collide(it, pHit)) {
            if (it.type === 'power' && powerLevel < MAX_POWER) {
                powerLevel++;
                if (powerLevel === MAX_POWER) flashTip('🔓 火力突破上限 Lv.30！开大必出 50 伤子弹！');
            }
            else if (it.type === 'shield') shield = true;
            else if (it.type === 'bomb') bombs = Math.min(bombs+1, MAX_BOMBS);
            else if (it.type === 'heart' && lives < MAX_LIVES) { lives++; updateHUD(true); flashTip('💖 +1 生命'); }
            it.y = 9999; playSound('powerup');
            effects.push({ type: it.type, timer: 40, maxTimer: 40, pl: powerLevel });
            updateHUD();
        }
    });

    // 敌机子弹（含追踪弹转向）
    enemyBullets.forEach(function(b) {
        if (b.homing) {
            var desired = Math.atan2(player.y - b.y, player.x - b.x);
            var cur = Math.atan2(b.vy, b.vx);
            var diff = desired - cur;
            while (diff > Math.PI) diff -= 2*Math.PI;
            while (diff < -Math.PI) diff += 2*Math.PI;
            var turn = 0.045;
            if (diff > turn) cur += turn; else if (diff < -turn) cur -= turn; else cur = desired;
            var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy) || 2;
            b.vx = Math.cos(cur)*sp; b.vy = Math.sin(cur)*sp;
        }
        b.x += b.vx || 0; b.y += b.vy || b.speed;
    });
    enemyBullets = enemyBullets.filter(function(b) { return b.y < canvas.height+30 && b.x > -20 && b.x < canvas.width+20; });

    // 预警线计时
    warnings.forEach(function(w) { w.timer--; });
    warnings = warnings.filter(function(w) { return w.timer > 0; });

    // 🚀 碰撞：空间分区 —— 按 x 坐标分桶，子弹只检测同桶±邻桶的敌机，避免 O(n*m)
    // 打 Boss 弹幕密集时，原先每帧上千次 collide 是"偶尔卡"的主因，分区后降到几十次
    var cellW = 60;
    var buckets = {};
    enemies.forEach(function(e, ei) {
        var c = Math.floor((e.x + e.w / 2) / cellW);
        (buckets[c] = buckets[c] || []).push(ei);
    });
    var dead = {};
    bullets.forEach(function(b) {
        var dmg = b.damage || 1;
        var bc = Math.floor((b.x + (b.w || 3) / 2) / cellW);
        for (var dc = -1; dc <= 1; dc++) {
            var arr = buckets[bc + dc];
            if (!arr) continue;
            for (var ai = 0; ai < arr.length; ai++) {
                var e = enemies[arr[ai]];
                if (!e || dead[arr[ai]]) continue;
                if (collide(b, e)) {
                    b.y = -999; e.hp -= dmg;
                    if (e.hp <= 0) dead[arr[ai]] = true;
                }
            }
        }
        if (bossActive && boss && collide(b, boss)) { b.y = -999; damageBoss(dmg); }
    });
    Object.keys(dead).forEach(function(ei) {
        ei = parseInt(ei);
        var e = enemies[ei];
        if (e) {
            score += e.type === 'heavy' ? 40 : 15;
            explode(e.x+e.w/2, e.y+e.h/2);
            // 重炮手必掉道具，侦察机 15% 概率
            if (e.type === 'heavy' || Math.random() < 0.15) spawnItem(e.x+e.w/2, e.y+e.h/2);
        }
    });
    enemies = enemies.filter(function(e, ei) { return !dead[ei]; });

    enemyBullets.forEach(function(b) { if (collide(b, pHit)) { b.y = 9999; hitPlayer(); } });
    enemies.forEach(function(e) {
        if (collide(e, pHit)) { var ei = enemies.indexOf(e); if (!dead[ei]) { score += e.type==='heavy'?10:5; explode(e.x+e.w/2, e.y+e.h/2); hitPlayer(); } }
    });
    if (bossActive && boss && collide(boss, pHit)) { damageBoss(0); hitPlayer(); }

    explosions.forEach(function(ex) { ex.r += 1.5; ex.alpha -= 0.04; });
    explosions = explosions.filter(function(ex) { return ex.alpha > 0; });
    // 尾迹粒子更新（移动 + 衰减；rainbow 色相持续循环）
    trails.forEach(function(t) { t.x += t.vx; t.y += t.vy; t.life--; if (t.rainbow) t.hue = (t.hue + 6) % 360; });
    trails = trails.filter(function(t) { return t.life > 0; });
    effects.forEach(function(ef) { ef.timer--; });
    effects = effects.filter(function(ef) { return ef.timer > 0; });
    updateHUD();
}

// ================= 绘制：精美化外观 =================

function drawPlayer() {
    if (invincible > 0 && Math.floor(invincible/3)%2 === 0) return;
    var pl = powerLevel; // 当前火力等级，决定战机外观进化程度
    ctx.save(); ctx.translate(player.x, player.y);
    // 🌀 旋转技能激活时：整机（含光环/机身/机翼）随火力自转 0.5~3×
    if (spinActive > 0) ctx.rotate(playerSpinAngle);
    if (shield) { ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.stroke(); }

    // ===== Lv10：彩色环绕光环 —— 垫在最底层（不遮挡机身/机翼），圆心严格居中 (0,0) =====
    if (pl >= 10) {
        var ot = Date.now() / 1000;
        var baseHue = (ot * 90) % 360;       // 色相持续循环 → "变成彩色"
        var orbR = 38;                        // 略大于机身，形成环绕效果
        ctx.save();
        ctx.rotate(ot * 1.6);                 // 整体缓缓旋转
        var og = ctx.createLinearGradient(-orbR, 0, orbR, 0);
        og.addColorStop(0,   'hsl(' + baseHue + ',100%,62%)');
        og.addColorStop(0.5, 'hsl(' + ((baseHue + 60) % 360) + ',100%,72%)');
        og.addColorStop(1,   'hsl(' + ((baseHue + 120) % 360) + ',100%,62%)');
        ctx.strokeStyle = og;
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 7]);             // 虚线分段，流动更明显
        ctx.lineDashOffset = -ot * 50;        // 沿环流动 → "环绕"
        ctx.beginPath(); ctx.arc(0, 0, orbR, 0, Math.PI * 2); ctx.stroke();
        // 内层反向细环，增强彩色流转感
        ctx.setLineDash([6, 8]);
        ctx.lineDashOffset = ot * 40;
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'hsla(' + ((baseHue + 180) % 360) + ',100%,75%,0.8)';
        ctx.beginPath(); ctx.arc(0, 0, orbR - 9, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }

    // ===== 基础机身（所有等级共有）=====
    var bodyGrad = ctx.createLinearGradient(0,-22,0,24);
    bodyGrad.addColorStop(0,'#5cf'); bodyGrad.addColorStop(1,'#058');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(-16,10); ctx.lineTo(-9,14); ctx.lineTo(-9,24); ctx.lineTo(9,24); ctx.lineTo(9,14); ctx.lineTo(16,10); ctx.closePath(); ctx.fill();

    // ===== Lv2+：加长主翼 =====
    var wingColor = pl >= 7 ? '#058' : '#07c';  // 加亮：原为深暗蓝(#024/#047)，现改为饱和亮蓝，不再发灰透明
    ctx.fillStyle = wingColor;
    if (pl >= 2) {
        ctx.beginPath(); ctx.moveTo(-16,8); ctx.lineTo(-30,15); ctx.lineTo(-15,19); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(16,8); ctx.lineTo(30,15); ctx.lineTo(15,19); ctx.closePath(); ctx.fill();
    } else {
        ctx.beginPath(); ctx.moveTo(-16,8); ctx.lineTo(-28,16); ctx.lineTo(-15,18); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(16,8); ctx.lineTo(28,16); ctx.lineTo(15,18); ctx.closePath(); ctx.fill();
    }

    // ===== Lv3+：机首双炮管 =====
    if (pl >= 3) {
        ctx.fillStyle = '#9cf';
        ctx.fillRect(-6, -24, 3, 6);
        ctx.fillRect(3, -24, 3, 6);
    }

    // ===== Lv4+：尾部稳定翼 =====
    if (pl >= 4) {
        ctx.fillStyle = wingColor;
        ctx.beginPath(); ctx.moveTo(-9,18); ctx.lineTo(-14,26); ctx.lineTo(-6,24); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(9,18); ctx.lineTo(14,26); ctx.lineTo(6,24); ctx.closePath(); ctx.fill();
    }

    // ===== Lv5+：第二层下翼（双翼构型）=====
    if (pl >= 5) {
        ctx.fillStyle = '#07c';  // 加亮：原为暗青(#035)
        ctx.beginPath(); ctx.moveTo(-14,16); ctx.lineTo(-22,22); ctx.lineTo(-10,22); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(14,16); ctx.lineTo(22,22); ctx.lineTo(10,22); ctx.closePath(); ctx.fill();
    }

    // ===== 驾驶舱（高等级更明亮）=====
    var cockGrad = ctx.createLinearGradient(0,-8,0,6);
    cockGrad.addColorStop(0, pl >= 8 ? '#ffffff' : '#dff');
    cockGrad.addColorStop(1, pl >= 6 ? '#5df' : '#0af');
    ctx.fillStyle = cockGrad; ctx.beginPath(); ctx.ellipse(0,-4,5,9,0,0,Math.PI*2); ctx.fill();

    // ===== Lv6+：翼尖发光 =====
    if (pl >= 6) {
        ctx.fillStyle = '#0ff';
        ctx.beginPath(); ctx.arc(-30,15,2.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(30,15,2.5,0,Math.PI*2); ctx.fill();
    }

    // ===== Lv7+：背部装甲脊 =====
    if (pl >= 7) {
        ctx.fillStyle = '#035';
        ctx.beginPath(); ctx.moveTo(-4,-22); ctx.lineTo(0,-30); ctx.lineTo(4,-22); ctx.closePath(); ctx.fill();
    }

    // ===== Lv8+：肩部能量炮 =====
    if (pl >= 8) {
        ctx.fillStyle = '#fa0';
        ctx.fillRect(-18, 4, 5, 10);
        ctx.fillRect(13, 4, 5, 10);
        ctx.fillStyle = '#ff0';
        ctx.beginPath(); ctx.arc(-15.5,4,2.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(15.5,4,2.5,0,Math.PI*2); ctx.fill();
    }

    // ===== Lv9+：全身发光描边 =====
    if (pl >= 9) {
        ctx.strokeStyle = 'rgba(120,220,255,0.9)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(-16,10); ctx.lineTo(-9,14); ctx.lineTo(-9,24); ctx.lineTo(9,24); ctx.lineTo(9,14); ctx.lineTo(16,10); ctx.closePath(); ctx.stroke();
    }

    // ===== 引擎喷焰（等级越高越亮越大）=====
    var thrust = 22 + Math.random()*14 + (pl - 1) * 2;
    var tg = ctx.createRadialGradient(0,26,0,0,thrust,10);
    if (pl >= 8)      { tg.addColorStop(0,'rgba(180,240,255,0.95)'); tg.addColorStop(1,'rgba(0,120,255,0)'); }
    else if (pl >= 5) { tg.addColorStop(0,'rgba(255,240,150,0.95)'); tg.addColorStop(1,'rgba(255,120,0,0)'); }
    else              { tg.addColorStop(0,'rgba(255,230,90,0.95)');  tg.addColorStop(1,'rgba(255,80,0,0)'); }
    ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(0,26,6,thrust*0.6,0,0,Math.PI*2); ctx.fill();

    // ===== Lv10：双引擎喷口 =====
    if (pl >= 10) {
        var tg2 = ctx.createRadialGradient(-9,24,0,0,thrust*0.7,8);
        tg2.addColorStop(0,'rgba(180,240,255,0.9)'); tg2.addColorStop(1,'rgba(0,120,255,0)');
        ctx.fillStyle = tg2; ctx.beginPath(); ctx.ellipse(-9,24,4,thrust*0.5,0,0,Math.PI*2); ctx.fill();
        var tg3 = ctx.createRadialGradient(9,24,0,0,thrust*0.7,8);
        tg3.addColorStop(0,'rgba(180,240,255,0.9)'); tg3.addColorStop(1,'rgba(0,120,255,0)');
        ctx.fillStyle = tg3; ctx.beginPath(); ctx.ellipse(9,24,4,thrust*0.5,0,0,Math.PI*2); ctx.fill();
    }

    // ===== 🔓 Lv30「突破上限」：外观全面进化（常态常驻，无需开大）=====
    if (isBreakthrough()) {
        var bt2 = Date.now() / 1000;
        // 外层金色超环（比彩色光环更大，象征突破）
        ctx.save();
        ctx.rotate(bt2 * 2.2);
        var sg = ctx.createLinearGradient(-48, 0, 48, 0);
        sg.addColorStop(0, 'hsla(' + ((bt2*90)%360) + ',100%,60%,0.9)');
        sg.addColorStop(0.5, 'hsla(' + ((bt2*90+60)%360) + ',100%,72%,1)');
        sg.addColorStop(1, 'hsla(' + ((bt2*90+120)%360) + ',100%,60%,0.9)');
        ctx.strokeStyle = sg; ctx.lineWidth = 3;
        ctx.setLineDash([14, 8]); ctx.lineDashOffset = -bt2 * 60;
        ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        // 金色外发光
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(bt2 * 5);
        ctx.strokeStyle = '#fd4'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, 48, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
        // 金色全身描边
        ctx.strokeStyle = '#fd4'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(-16,10); ctx.lineTo(-9,14); ctx.lineTo(-9,24); ctx.lineTo(9,24); ctx.lineTo(9,14); ctx.lineTo(16,10); ctx.closePath(); ctx.stroke();
        // 常驻双加特林（突破后平时就有，开大时仍正常显示）
        var ws2 = getWingSpan(), rot2 = (Date.now() / 18) % (Math.PI * 2);
        [-ws2, ws2].forEach(function(gx) {
            ctx.fillStyle = '#4a3a2a'; ctx.fillRect(gx - 3, 8, 6, 14);
            ctx.save(); ctx.translate(gx, 22); ctx.rotate(rot2);
            ctx.fillStyle = '#8a7a6a'; ctx.fillRect(-2, 0, 4, 12);
            ctx.fillStyle = '#f0c060'; ctx.fillRect(-3, 12, 6, 3);
            ctx.restore();
            ctx.fillStyle = '#ffe08a'; ctx.beginPath(); ctx.arc(gx, 22, 3, 0, Math.PI * 2); ctx.fill();
        });
    }

    // ===== 🔥 开大：机翼下两个加特林（开大期间始终显示，随整机旋转）=====
    if (ultActive > 0) {
        var ws = getWingSpan(), rot = (Date.now() / 18) % (Math.PI * 2);
        [-ws, ws].forEach(function(gx) {
            ctx.fillStyle = '#3a4a5a';                 // 支架
            ctx.fillRect(gx - 3, 10, 6, 12);
            ctx.save();
            ctx.translate(gx, 22);
            ctx.rotate(rot);                            // 炮管旋转动画
            ctx.fillStyle = '#6c7a8a';
            ctx.fillRect(-2, 0, 4, 11);
            ctx.fillStyle = '#9aa8b8';
            ctx.fillRect(-3, 11, 6, 3);
            ctx.restore();
            ctx.fillStyle = '#ffe08a';                  // 枪口火光
            ctx.beginPath(); ctx.arc(gx, 22, 3.2, 0, Math.PI * 2); ctx.fill();
        });
    }

    ctx.restore();
}

// ===== 玩家子弹：简洁发光胶囊（无闪光芒刺）；开大 50 伤子弹为彩虹 + 尾迹 =====
function drawBullet(b) {
    // 🌈 开大·50 伤子弹：彩色弹体 + 拖尾
    if (b.rainbow) {
        b._hue = (b._hue == null ? Math.random() * 360 : b._hue + 9) % 360;
        var hh = b._hue;
        ctx.save();
        ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
        // 拖尾（沿飞行方向向下的彩色光带）
        var tg = ctx.createLinearGradient(0, b.h * 0.5, 0, b.h * 0.5 + 26);
        tg.addColorStop(0, 'hsla(' + hh + ',100%,65%,0.9)');
        tg.addColorStop(1, 'hsla(' + hh + ',100%,65%,0)');
        ctx.fillStyle = tg;
        ctx.fillRect(-b.w * 0.6, b.h * 0.5, b.w * 1.2, 26);
        // 弹体
        ctx.fillStyle = 'hsl(' + hh + ',100%,72%)';
        ctx.beginPath(); ctx.ellipse(0, 0, b.w * 0.6, b.h / 2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(0, -b.h * 0.1, b.w * 0.35, b.h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
    }
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    // 柔和光晕
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, 9);
    g.addColorStop(0, 'rgba(255,240,150,0.55)');
    g.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    // 实体弹体（竖直胶囊）
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.ellipse(0, 0, b.w * 0.6, b.h / 2, 0, 0, Math.PI * 2); ctx.fill();
    // 高光芯
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(0, -b.h * 0.15, b.w * 0.35, b.h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawScout(e) {
    ctx.save(); ctx.translate(e.x+e.w/2, e.y+e.h/2);
    // 流线型机身，机头朝下（朝玩家方向俯冲，不再倒着飞）
    var g = ctx.createLinearGradient(0,-e.h/2,0,e.h/2);
    g.addColorStop(0,'#a00'); g.addColorStop(1,'#f99');  // 顶部深、机头(底)亮
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, e.h/2);                    // 机头（底部，朝向玩家）
    ctx.lineTo(-e.w/2+4, -e.h/2+10);         // 左肩
    ctx.lineTo(0, -e.h/2 + 2);               // 尾部顶点（顶部）
    ctx.lineTo(e.w/2-4, -e.h/2+10);          // 右肩
    ctx.closePath(); ctx.fill();
    // 机翼（位于肩部，即机身靠后的一侧）
    ctx.fillStyle = '#c1c';
    ctx.beginPath(); ctx.moveTo(-e.w/2+4,-e.h/2+10); ctx.lineTo(-e.w/2-6,-e.h/2+14); ctx.lineTo(-e.w/2+2,-e.h/2+2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.w/2-4,-e.h/2+10);  ctx.lineTo(e.w/2+6,-e.h/2+14);  ctx.lineTo(e.w/2-2,-e.h/2+2); ctx.closePath(); ctx.fill();
    // 座舱（靠近机头）
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, e.h/2-9, 2.5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawHeavy(e) {
    ctx.save(); ctx.translate(e.x+e.w/2, e.y+e.h/2);
    // 六边形装甲机体（不再是单调方块）
    var g = ctx.createLinearGradient(0,-e.h/2,0,e.h/2);
    g.addColorStop(0,'#b070e0'); g.addColorStop(1,'#401080');
    ctx.fillStyle = g;
    ctx.beginPath();
    var pts = [[-e.w/2+4,-e.h/2+6],[e.w/2-4,-e.h/2+6],[e.w/2,-e.h/2+16],[e.w/2-2,e.h/2-2],[-e.w/2+2,e.h/2-2],[-e.w/2,-e.h/2+16]];
    pts.forEach(function(p){ ctx.lineTo(p[0],p[1]); });
    ctx.closePath(); ctx.fill();
    // 装甲边框
    ctx.strokeStyle = 'rgba(220,180,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-e.w/2+6,-e.h/2+9,e.w-12,e.h-20);
    // 能量核心
    var cg = ctx.createRadialGradient(0,0,0,0,0,9);
    cg.addColorStop(0,'#fff'); cg.addColorStop(0.45,'#f50'); cg.addColorStop(1,'#800');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
    // 双炮管
    ctx.fillStyle = '#333';
    ctx.fillRect(-e.w/2+2,e.h/2-8,6,9); ctx.fillRect(e.w/2-8,e.h/2-8,6,9);
    ctx.restore();
}

function drawEnemy(e) {
    if (e.type === 'heavy') drawHeavy(e);
    else drawScout(e);
}

function drawItem(it) {
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.shadowBlur = 12;
    if (it.type === 'power') {
        var isMax = (powerLevel >= MAX_POWER - 1);   // 🔓 下一次拾取即达 Lv30 → 紫色突破道具
        ctx.shadowColor = isMax ? '#f0f' : '#0f0'; ctx.fillStyle = isMax ? '#f0f' : '#0f0';
        ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3,-3,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = isMax ? '#f0f' : '#0f0'; ctx.beginPath(); ctx.moveTo(0,5); ctx.lineTo(-4,11); ctx.lineTo(4,11); ctx.closePath(); ctx.fill();
        if (isMax) { ctx.fillStyle = '#fff'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.fillText('MAX', 0, 15); }
    } else if (it.type === 'shield') {
        ctx.shadowColor = '#0ff'; ctx.fillStyle = '#0ff';
        ctx.beginPath(); ctx.arc(0,0,11,Math.PI,0); ctx.lineTo(11,6); ctx.lineTo(-11,6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,2,4,0,Math.PI*2); ctx.fill();
    } else if (it.type === 'heart') { // 💖 爱心：回 1 滴血
        ctx.shadowColor = '#f39'; ctx.fillStyle = '#f39';
        ctx.beginPath();
        ctx.moveTo(0,6);
        ctx.bezierCurveTo(-14,-6,-8,-16,0,-8);
        ctx.bezierCurveTo(8,-16,14,-6,0,6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
        ctx.fillText('+1', 0, 12);
    } else { // bomb
        ctx.shadowColor = '#f00'; ctx.fillStyle = '#d20';
        ctx.beginPath(); ctx.arc(0,2,10,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(0,-2,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0,-8); ctx.quadraticCurveTo(5,-15,10,-12); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
        ctx.fillText('B', 0, 6);
    }
    ctx.restore();
}

function drawBoss() {
    if (!boss) return;
    ctx.save(); ctx.translate(boss.x+boss.w/2, boss.y+boss.h/2);
    if (boss.kind === 0) {
        // 烈焰战机：恶魔战斗机（不再是单调三角）
        // 🚀 缓存渐变对象（每帧复用，避免频繁创建触发 GC 卡顿）
        if (!boss._flameGrad || boss._flameGrad.canvas !== ctx.canvas) boss._flameGrad = ctx.createLinearGradient(0,-35,0,35);
        var g = boss._flameGrad;
        g.addColorStop(0,'#f90'); g.addColorStop(1,'#900');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0,-35); ctx.lineTo(-42,30); ctx.lineTo(-15,35); ctx.lineTo(0,20); ctx.lineTo(15,35); ctx.lineTo(42,30); ctx.closePath(); ctx.fill();
        // 恶魔角
        ctx.fillStyle = '#f50';
        ctx.beginPath(); ctx.moveTo(-8,-30); ctx.lineTo(-15,-44); ctx.lineTo(-2,-32); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8,-30); ctx.lineTo(15,-44); ctx.lineTo(2,-32); ctx.closePath(); ctx.fill();
        // 双眼
        ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(-11,0,4,0,Math.PI*2); ctx.arc(11,0,4,0,Math.PI*2); ctx.fill();
        // 利齿下颌
        ctx.fillStyle = '#600'; ctx.beginPath(); ctx.moveTo(-13,16); ctx.lineTo(0,30); ctx.lineTo(13,16); ctx.closePath(); ctx.fill();
    } else if (boss.kind === 1) {
        // 暗影旋涡：旋转黑洞（不再是单调菱形）
        var og = ctx.createRadialGradient(0,0,4,0,0,48);
        og.addColorStop(0,'rgba(190,80,230,0.9)'); og.addColorStop(0.55,'rgba(90,20,140,0.5)'); og.addColorStop(1,'rgba(20,0,40,0)');
        ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0,0,48,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#e6a'; ctx.lineWidth = 4;
        for (var arm = 0; arm < 3; arm++) {
            ctx.save(); ctx.rotate(Date.now()*0.003 + arm * 2*Math.PI/3);
            ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(16,-22,0,-40); ctx.stroke();
            ctx.restore();
        }
        var cc = ctx.createRadialGradient(0,0,0,0,0,13);
        cc.addColorStop(0,'#fff'); cc.addColorStop(1,'#60f');
        ctx.fillStyle = cc; ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
    } else {
        // 末日泰坦：机械巨甲（不再是单调方块），随阶段变色
        var cols = ['#373','#5a5','#8c8'];
        var col = cols[boss.phase] || '#8c8';
        var mg = ctx.createLinearGradient(0,-38,0,38);
        mg.addColorStop(0,col); mg.addColorStop(1,'#030');
        ctx.fillStyle = mg; ctx.fillRect(-48,-38,96,76);
        // 斜切装甲
        ctx.fillStyle = '#161';
        ctx.beginPath(); ctx.moveTo(-48,-38); ctx.lineTo(-28,-38); ctx.lineTo(-48,38); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(48,-38); ctx.lineTo(28,-38); ctx.lineTo(48,38); ctx.closePath(); ctx.fill();
        // 肩部尖刺
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(-48,0); ctx.lineTo(-60,-12); ctx.lineTo(-40,8); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(48,0); ctx.lineTo(60,-12); ctx.lineTo(40,8); ctx.closePath(); ctx.fill();
        // 中央反应炉
        var flash = boss.phaseTransition > 0 ? (Math.floor(Date.now()/60)%2 === 0) : true;
        var rc = flash ? '#0f0' : '#050';
        var rg = ctx.createRadialGradient(0,0,0,0,0,20);
        rg.addColorStop(0,'#fff'); rg.addColorStop(0.5,rc); rg.addColorStop(1,'#030');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
        // 双臂炮管
        ctx.fillStyle = '#555'; ctx.fillRect(-44,22,14,20); ctx.fillRect(30,22,14,20);
        ctx.fillStyle = col; ctx.fillRect(-40,40,6,10); ctx.fillRect(34,40,6,10);

        // 🛡️ 防御形态「量子护盾」光环：蓝白色能量球，随剩余值脉动
        if (boss.energyShield > 0 && boss.energyShieldMax > 0) {
            var shp = boss.energyShield / boss.energyShieldMax;      // 1→0
            var shR = 56 + Math.sin(Date.now()/40) * 4;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            var shg = ctx.createRadialGradient(0, 0, 0, 0, 0, shR);
            shg.addColorStop(0, 'rgba(180,220,255,' + (0.35 + 0.25 * shp) + ')');
            shg.addColorStop(0.6, 'rgba(60,140,255,' + (0.5 * shp) + ')');
            shg.addColorStop(1, 'rgba(0,60,180,0)');
            ctx.fillStyle = shg; ctx.beginPath(); ctx.arc(0, 0, shR, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(140,200,255,' + (0.6 + 0.4 * Math.sin(Date.now()/50)) + ')';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, shR, 0, Math.PI*2); ctx.stroke();
            // 护盾值条
            ctx.fillStyle = 'rgba(120,200,255,0.9)';
            ctx.fillRect(-46, -52, 92 * shp, 4);
            ctx.restore();
        }

        // 💥 毁灭形态「末日新星Ⅱ」蓄力特效：反应炉黑红超频 + 逆向旋转能量漩涡
        if (boss.nova2Charge > 0) {
            var prog = 1 - boss.nova2Charge / 150;                  // 0→1
            var pulse2 = 0.5 + 0.5 * Math.sin(Date.now() / 22);
            var radius2 = 30 + prog * 90;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            // 外扩暗红光环
            ctx.strokeStyle = 'rgba(255,' + Math.floor(30 + (1-prog) * 60) + ',0,' + (0.9 - prog * 0.35) + ')';
            ctx.lineWidth = 5 + pulse2 * 6;
            ctx.beginPath(); ctx.arc(0, 0, radius2, 0, Math.PI*2); ctx.stroke();
            // 逆向旋转能量漩涡（双螺旋）
            for (var sw = 0; sw < 2; sw++) {
                ctx.rotate(prog * 6 + sw * Math.PI);
                ctx.strokeStyle = 'rgba(255,' + Math.floor(60 + prog * 120) + ',20,' + (0.5 + prog * 0.4) + ')';
                ctx.lineWidth = 2 + prog * 3;
                ctx.beginPath();
                for (var st = 0; st < 60; st++) {
                    var sa = (st / 60) * Math.PI * 4;
                    var sr = (st / 60) * radius2;
                    var sx = Math.cos(sa) * sr, sy = Math.sin(sa) * sr;
                    st === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
                }
                ctx.stroke();
            }
            // 反应炉白热化
            var n2g = ctx.createRadialGradient(0, 0, 0, 0, 0, 24 + prog * 24);
            n2g.addColorStop(0, 'rgba(255,255,255,' + (0.5 + prog * 0.5) + ')');
            n2g.addColorStop(0.4, 'rgba(255,60,0,' + (0.4 + prog * 0.5) + ')');
            n2g.addColorStop(1, 'rgba(80,0,0,0)');
            ctx.fillStyle = n2g; ctx.beginPath(); ctx.arc(0, 0, 24 + prog * 24, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        // 🌟 末日新星蓄力特效：反应炉超频脉动 + 扩张能量环 + 危险红光
        if (boss.novaCharge > 0) {
            var charge = 1 - boss.novaCharge / 90; // 0→1
            var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 30);
            var radius = 30 + charge * 70;          // 能量环随蓄力扩张
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            // 外扩能量环
            ctx.strokeStyle = 'rgba(255,' + Math.floor(60 + charge * 120) + ',' + Math.floor(charge * 60) + ',' + (0.9 - charge * 0.4) + ')';
            ctx.lineWidth = 4 + pulse * 4;
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.stroke();
            // 内圈强闪光
            var ng = ctx.createRadialGradient(0, 0, 0, 0, 0, 26 + charge * 30);
            ng.addColorStop(0, 'rgba(255,255,255,' + (0.4 + charge * 0.5) + ')');
            ng.addColorStop(0.5, 'rgba(255,120,0,' + (0.3 + charge * 0.5) + ')');
            ng.addColorStop(1, 'rgba(255,0,0,0)');
            ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(0, 0, 26 + charge * 30, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#0a0a2a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    stars.forEach(function(s) { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random()*canvas.width; } ctx.globalAlpha = 0.5+Math.sin(s.y*0.05)*0.3; ctx.fillRect(s.x, s.y, s.s, s.s); });
    ctx.globalAlpha = 1;

    // 激光预警线
    warnings.forEach(function(w) {
        ctx.strokeStyle = 'rgba(255,0,0,' + (0.3 + 0.5*Math.sin(w.timer*0.6)) + ')';
        ctx.lineWidth = 3; ctx.setLineDash([8,6]);
        ctx.beginPath(); ctx.moveTo(w.x, 0); ctx.lineTo(w.x, canvas.height); ctx.stroke();
        ctx.setLineDash([]);
    });

    explosions.forEach(function(ex) {
        var g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.r);
        g.addColorStop(0,'rgba(255,200,0,'+ex.alpha+')'); g.addColorStop(0.5,'rgba(255,80,0,'+(ex.alpha*0.6)+')'); g.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2); ctx.fill();
    });

    // 特效（含炸弹全屏闪光）
    effects.forEach(function(ef) {
        if (ef.kind === 'flash') {
            var fp = 1 - ef.timer/ef.maxTimer;
            ctx.globalAlpha = 1 - fp;
            ctx.fillStyle = 'rgba(255,255,255,' + (1 - fp) + ')';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1;
            return;
        }
        // 💥 毁灭形态「末日新星Ⅱ」膨胀特效：黑红吞噬 + 余烬环
        if (ef.kind === 'nova2Boom') {
            var np = 1 - ef.timer/ef.maxTimer;               // 0→1
            var nr = 20 + np * 420;                          // 半径从 20 扩张到铺满屏幕
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            var nvg = ctx.createRadialGradient(ef.x, ef.y, 0, ef.x, ef.y, nr);
            nvg.addColorStop(0, 'rgba(255,240,200,' + (1 - np) * 0.9 + ')');
            nvg.addColorStop(0.35, 'rgba(255,120,20,' + (1 - np) * 0.7 + ')');
            nvg.addColorStop(0.7, 'rgba(120,0,0,' + (1 - np) * 0.5 + ')');
            nvg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = nvg; ctx.beginPath(); ctx.arc(ef.x, ef.y, nr, 0, Math.PI*2); ctx.fill();
            // 旋转余烬环
            ctx.rotate(np * 4);
            ctx.strokeStyle = 'rgba(255,180,60,' + (1 - np) + ')';
            ctx.lineWidth = 3 + (1 - np) * 6;
            ctx.beginPath(); ctx.arc(ef.x, ef.y, nr * 0.72, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
            ctx.globalAlpha = 1;
            return;
        }
        // 🛡️ 护盾展开/破碎特效
        if (ef.kind === 'shieldExpand' || ef.kind === 'shieldBreak') {
            var sp = 1 - ef.timer/ef.maxTimer;
            var sr = (ef.kind === 'shieldBreak' ? 60 + sp * 200 : ef.r + sp * 260);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = ef.kind === 'shieldBreak' ? 'rgba(255,80,40,' + (1 - sp) + ')' : 'rgba(80,180,255,' + (1 - sp) + ')';
            ctx.lineWidth = 4 + (1 - sp) * 8;
            ctx.beginPath(); ctx.arc(ef.x, ef.y, sr, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
            ctx.globalAlpha = 1;
            return;
        }
        var p = 1 - ef.timer/ef.maxTimer; ctx.globalAlpha = 1 - p;
        if (ef.type === 'power') { ctx.fillStyle = ef.pl>5?'#ff0':'#0f0'; ctx.font = 'bold 16px monospace'; ctx.fillText(ef.pl>5?'SPEED UP':'+FIRE', ef.x-25, ef.y-p*30); }
        else if (ef.type === 'shield') { ctx.strokeStyle = '#0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ef.x, ef.y, p*40, 0, Math.PI*2); ctx.stroke(); }
        else { ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(ef.x, ef.y, p*50, 0, Math.PI*2); ctx.fill(); }
        ctx.globalAlpha = 1;
    });

    items.forEach(drawItem);
    drawPlayer();
    drawLaserBeam();
    // 🌈 机翼后 / 子弹尾迹粒子（开大期间产生，结束后清除）
    trails.forEach(function(t) {
        var alpha = Math.max(0, t.life / t.maxLife);
        if (t.rainbow) {
            t.hue = (t.hue + 8) % 360;
            ctx.fillStyle = 'hsla(' + t.hue + ',100%,65%,' + alpha + ')';
        } else {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = t.color;
        }
        ctx.beginPath(); ctx.arc(t.x, t.y, t.size * alpha, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    bullets.forEach(drawBullet);
    enemyBullets.forEach(function(b) {
        if (b.shield) {                                          // 🛡️ 护盾反击弹幕：蓝白高亮
            ctx.fillStyle = '#9df';
            ctx.beginPath(); ctx.arc(b.x+b.w/2, b.y+b.h/2, b.w*0.8, 0, Math.PI*2); ctx.fill();
            return;
        }
        if (b.heavy) {                                            // 💥 nova2 毁灭弹幕：橙红辉光
            ctx.save();
            ctx.shadowColor = '#f60'; ctx.shadowBlur = 8;
            ctx.fillStyle = '#f80';
            ctx.beginPath(); ctx.arc(b.x+b.w/2, b.y+b.h/2, b.w*0.7, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            return;
        }
        ctx.fillStyle = b.laser ? '#fff' : (b.homing ? '#fa0' : '#f0f');
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    enemies.forEach(drawEnemy);
    drawBoss();
}

// 🔴 激光束绘制：单道光束（机头 → 屏幕顶端），粗一点；旋转时随战机一起旋转
function drawLaserBeam() {
    if (laserActive <= 0) return;
    var angle = spinActive > 0 ? playerSpinAngle : 0;
    var len = player.y; // 机头到屏幕顶端的距离
    var pulse = 0.6 + 0.4 * Math.sin(Date.now() / 40);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(angle);                       // 🔑 旋转时激光跟随
    ctx.globalCompositeOperation = 'lighter';
    // 外发光晕（加粗）
    ctx.globalAlpha = 0.35 * pulse;
    ctx.fillStyle = '#f33';
    ctx.fillRect(-26, -len, 52, len);
    // 主光束（红→黄渐变，加粗）
    ctx.globalAlpha = 0.9;
    var g = ctx.createLinearGradient(0, -len, 0, 0);
    g.addColorStop(0, 'rgba(255,80,40,0.9)');
    g.addColorStop(0.6, 'rgba(255,30,30,1)');
    g.addColorStop(1, 'rgba(255,220,120,1)');
    ctx.fillStyle = g;
    ctx.fillRect(-12, -len, 24, len);
    // 核心白线（加粗）
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -len, 6, len);
    ctx.restore();
}

function loop() {
    try { update(); draw(); } catch (e) { /* 防止单帧错误冻结整个游戏 */ }
    requestAnimationFrame(loop);
}

// ===== 事件绑定：三重保险（addEventListener + onclick兜底 + 全局函数） =====
function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener('click', fn); el.onclick = fn; }
    return el;
}
function bindAll() {
    bind('startBtn', startGame);
    bind('restartBtn', restart);
    bind('victoryBtn', restart);
    // 💣 手机炸弹按钮（同时绑 click 与 touchstart，阻止穿透到画布）
    var bb = bind('bombBtn', useBomb);
    if (bb) {
        bb.addEventListener('touchstart', function(ev) { ev.preventDefault(); ev.stopPropagation(); useBomb(); }, { passive: false });
    }
    // 🌀🔴 技能按钮（click + touchstart 双绑，阻止穿透到画布）
    var sb = bind('spinBtn', activateSpin);
    if (sb) sb.addEventListener('touchstart', function(ev) { ev.preventDefault(); ev.stopPropagation(); activateSpin(); }, { passive: false });
    var lb = bind('laserBtn', activateLaser);
    if (lb) lb.addEventListener('touchstart', function(ev) { ev.preventDefault(); ev.stopPropagation(); activateLaser(); }, { passive: false });
    // 🔓 突破技按钮（Lv30）：R 键 / 点击 / 触摸 三绑
    var brb = bind('breakBtn', activateBreak);
    if (brb) brb.addEventListener('touchstart', function(ev) { ev.preventDefault(); ev.stopPropagation(); activateBreak(); }, { passive: false });
    // 🔓 突破技激活期间：机身环绕辉光（跟随玩家位置），提供「移速×2 + 开大」的视觉反馈
    setBreakAura(breakActive > 0);
    bind('startScreen', function(ev) {
        if (ev.target && ev.target.id === 'startBtn') return;
        startGame();
    });
}

// 🔓 突破技激活期间：机身环绕辉光（跟随玩家位置），提供「移速×2 + 开大」的视觉反馈
function setBreakAura(on) {
    var aura = document.getElementById('breakAura');
    if (!aura) return;
    if (on) {
        aura.classList.add('on');
        aura.style.left = player.x + 'px';
        aura.style.top = player.y + 'px';
    } else {
        aura.classList.remove('on');
    }
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindAll);
} else {
    bindAll();
}
window.addEventListener('load', bindAll);

window.startGame = startGame;
window.restart = restart;

checkLeaderboard();
loop();
</script>
